# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: campuslink-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CA_PATH
        value: server/certs/supabase-ca.crt
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: campuslink-private
      - key: EMAIL_PROVIDER
        value: resend
      - key: AI_PROVIDER
        value: local
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
